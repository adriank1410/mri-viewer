[package]
name = "mri-viewer"
version = "0.2.0"
edition = "2024"
description = "Simple MRI/CT (DICOM) viewer with an MCP server for Claude"
license = "MIT OR Apache-2.0"
authors = ["Adrian Kwiatkowski <contact@adriankwiatkowski.eu>"]
repository = "https://github.com/adriank1410/mri-viewer"
homepage = "https://adriankwiatkowski.eu"

[dependencies]
dicom-core = "0.10"
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
dicom-pixeldata = { version = "0.10", features = ["openjpeg-sys", "image"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
base64 = "0.22"
anyhow = "1"
rayon = "1"
walkdir = "2"
sys-locale = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"
