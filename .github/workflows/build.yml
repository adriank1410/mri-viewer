name: Budowanie

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Kompilacja (Apple Silicon i Intel)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Pakiet .app
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP="dist/MRI Viewer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp packaging/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          lipo -create -output "$APP/Contents/MacOS/mri-viewer" \
            target/aarch64-apple-darwin/release/mri-viewer \
            target/x86_64-apple-darwin/release/mri-viewer
          sed "s/VERSION/$VERSION/g" packaging/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          cp README.md dist/README.md
          cp README.pl.md dist/CZYTAJ-MNIE.md
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.md dist/
          cd dist && ditto -c -k --keepParent "MRI Viewer.app" ../MRI-Viewer-macOS.zip
          cd .. && zip -j MRI-Viewer-macOS.zip dist/README.md dist/CZYTAJ-MNIE.md dist/LICENSE-MIT dist/LICENSE-APACHE dist/THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: MRI-Viewer-macOS
          path: MRI-Viewer-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/mri-viewer.exe dist/
          Copy-Item README.md dist/README.md
          Copy-Item README.pl.md dist/CZYTAJ-MNIE.md
          Copy-Item LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_LICENSES.md dist/
          Compress-Archive -Path dist/* -DestinationPath MRI-Viewer-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MRI-Viewer-Windows
          path: MRI-Viewer-Windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo build --release --locked
      - run: tar -czf MRI-Viewer-Linux.tar.gz -C target/release mri-viewer -C ../.. README.md README.pl.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: MRI-Viewer-Linux
          path: MRI-Viewer-Linux.tar.gz

  release:
    # każda zmiana na main: wydanie „Latest build”; nowa wersja w Cargo.toml: wydanie vX.Y.Z z opisem z CHANGELOG.md
    if: github.event_name == 'push'
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    # dwa szybkie scalenia: starsze wydanie czeka na nowsze, zamiast ścigać się o wydanie „latest”
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publikacja wydania
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VERSION"
          fi
          # opis wydania: sekcja „## X.Y.Z” z CHANGELOG.md
          awk -v v="${TAG#v}" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          printf '\n---\nDownload the file for your system: Mac `MRI-Viewer-macOS.zip`, Windows `MRI-Viewer-Windows.zip`, Linux `MRI-Viewer-Linux.tar.gz`.\n' >> notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MRI Viewer ${TAG#v}" --notes-file notes.md --latest dist/*.zip dist/*.tar.gz
          fi
          # „Latest build” tylko z najnowszego stanu main (starszy przebieg po nowszym niczego nie nadpisze)
          if [[ "$GITHUB_REF" == refs/heads/main && "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]; then
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest --target "$GITHUB_SHA" --prerelease --latest=false --title "Latest build" \
              --notes "Built automatically from the main branch ($GITHUB_SHA), with changes that may not be in a numbered release yet. Mac: download MRI-Viewer-macOS.zip." \
              dist/*.zip dist/*.tar.gz
          fi
